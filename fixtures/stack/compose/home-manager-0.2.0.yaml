# Compose publié par drakbase release : images épinglées par empreinte, sans section build. Les réglages de la machine vont dans son fichier .env, jamais ici.
{
  "services": {
    "backup": {
      "command": [
        "set -e; name=/backups/data-$$(date -u +%Y%m%dT%H%M%SZ).tar.gz; tar -czf \"$$name.part\" -C /data . && mv \"$$name.part\" \"$$name\"; ls -1t /backups/data-*.tar.gz | tail -n +6 | xargs -r rm -f; echo \"sauvegarde de /data : $$name\""
      ],
      "entrypoint": [
        "/bin/sh",
        "-c"
      ],
      "image": "updates.drakbase.com/home-manager/home-manager@sha256:1a376b213bb26b7f30391c6031ff72410b739666f17c18924f64b81a7f899b21",
      "profiles": [
        "drakbase-hooks"
      ],
      "volumes": [
        {
          "read_only": true,
          "source": "data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        },
        {
          "source": "backups",
          "target": "/backups",
          "type": "volume",
          "volume": {}
        }
      ]
    },
    "home-manager": {
      "environment": {
        "HM_GID": "${HM_GID:-1000}",
        "HM_PORT": "${HM_PORT:-8123}",
        "HM_READ_ONLY": "${HM_READ_ONLY:-1}",
        "HM_UID": "${HM_UID:-1000}",
        "TZ": "${TZ:-Europe/Paris}"
      },
      "image": "updates.drakbase.com/home-manager/home-manager@sha256:1a376b213bb26b7f30391c6031ff72410b739666f17c18924f64b81a7f899b21",
      "mem_limit": "512m",
      "network_mode": "host",
      "restart": "unless-stopped",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "stop_grace_period": "30s",
      "volumes": [
        {
          "source": "data",
          "target": "/data",
          "type": "volume",
          "volume": {}
        }
      ]
    }
  },
  "volumes": {
    "backups": {
      "name": "home-manager-backups"
    },
    "data": {
      "name": "home-manager-data"
    }
  }
}
