[package]
name = "am-protocol"
description = "Contrat partagé de DrakBase - Apps Market : versions, plateformes, réponses, signatures minisign au format Tauri, stacks Docker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
flate2.workspace = true
minisign = { workspace = true, optional = true }
minisign-verify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true

[features]
# Création de clés et signature (module `signing`, crate `minisign`, donc scrypt) : pour l'outil,
# et pour les essais du serveur et de l'agent. Sans elle, la crate ne sait que vérifier.
signing = ["dep:minisign"]

[dev-dependencies]
# Les essais et `gen_fixtures` signent avec les clés d'essai.
am-protocol = { path = ".", features = ["signing"] }
blake2.workspace = true
hex.workspace = true
minisign.workspace = true

[lints]
workspace = true
